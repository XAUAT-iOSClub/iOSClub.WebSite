name: Build Finance PaddleOCR

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/paddle-ocr/**"
      - ".github/workflows/paddle-ocr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/paddle-ocr
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finance-paddleocr:latest
            ghcr.io/${{ github.repository_owner }}/finance-paddleocr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
