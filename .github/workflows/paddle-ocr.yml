name: Build Finance OCR (NativeAOT)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'rearend/iOSClub.WebAPI/iOSClub.FinanceOcr/**'
      - '.github/workflows/paddle-ocr.yml'
  push:
    branches: [master]
    paths:
      - 'rearend/iOSClub.WebAPI/iOSClub.FinanceOcr/**'
      - '.github/workflows/paddle-ocr.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCAL_IMAGE: finance-ocr-aot:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build NativeAOT image
        uses: docker/build-push-action@v6
        with:
          context: rearend/iOSClub.WebAPI/iOSClub.FinanceOcr
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify NativeAOT service
        shell: bash
        run: |
          docker run -d --rm --name finance-ocr-ci -p 127.0.0.1:5099:5099 "$LOCAL_IMAGE"
          trap 'docker logs finance-ocr-ci; docker stop finance-ocr-ci' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5099/health
          curl -fsS --max-time 60 http://127.0.0.1:5099/ocr \
            -F file=@rearend/iOSClub.WebAPI/iOSClub.FinanceOcr/test-data/synthetic-invoice.png |
            jq -e '.rawText | contains("发票") and contains("12345678") and contains("318.00")'
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/master'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finance-ocr-aot"
          docker tag "$LOCAL_IMAGE" "$image:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
